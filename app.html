function drawModal(){let p=cur();$('#mt').textContent=p.customer;$('#ms').textContent=p.id+' · '+p.consultant;let ts=[['overview','Overview'],['days','Billable days'],['tasks','Work schedule'],['uat','UAT log'],['docs','Documents']];$('#tabs').innerHTML=ts.map(x=>`<button class="${s.tab===x[0]?'on':''}" onclick="tab('${x[0]}')">${x[1]}</button>`).join('');$('#pane').innerHTML=pane(p)}
function pane(p){if(s.tab==='overview')return `<div class="form">${input('Customer','customer',p.customer)}<div class="field"><label>Consultant</label><select data-k="consultant">${people.map(x=>`<option ${x===p.consultant?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>RAG status</label><select data-k="rag"><option value="green" ${p.rag==='green'?'selected':''}>Green</option><option value="amber" ${p.rag==='amber'?'selected':''}>Amber</option><option value="red" ${p.rag==='red'?'selected':''}>Red</option></select></div><div class="field"><label>Current phase</label><select data-k="phase">${phases.map(x=>`<option ${x===p.phase?'selected':''}>${x}</option>`).join('')}</select></div>${input('Phase start date','phaseDate',p.phaseDate,'date')}<div></div><div class="field full"><label>Project note</label><textarea data-k="note">${esc(p.note)}</textarea></div></div>`;if(s.tab==='days')return `<div class="boxes"><div class="box">Total<b>${p.total}</b></div><div class="box">Used<b>${p.used}</b></div><div class="box">Remaining<b>${p.total-p.used}</b></div><div class="box">Bookings<b>${p.bookings.length}</b></div></div><div class="form" style="margin-top:15px">${input('Total billable days','total',p.total,'number')}${input('Days completed','used',p.used,'number')}</div><h3>Days by category</h3><div class="form">${Object.entries(p.cats).map(([k,v])=>input(k,'cat:'+k,v,'number')).join('')}</div><h3>Booked days</h3><div class="add"><div class="field"><label>Date</label><input id="bd" type="date"></div><div class="field"><label>Days</label><input id="bn" type="number" step=".5" value="1"></div><div></div><button class="btn primary" onclick="addBooking()">Add</button></div>${p.bookings.map((b,i)=>`<div class="item"><b>${b[0]}</b><span>${b[1]} day</span><span></span><span></span><button class="btn danger" onclick="remove('bookings',${i})">Remove</button></div>`).join('')}`;if(s.tab==='tasks')return `<h3>Work breakdown schedule</h3><div class="add"><div class="field"><label>Task</label><input id="tn"></div><div class="field"><label>Planned date</label><input id="td" type="date"></div><div class="field"><label>Owner</label><select id="to"><option>Consultant</option><option>Customer</option></select></div><button class="btn primary" onclick="addTask()">Add</button></div>${p.tasks.map((t,i)=>`<div class="item"><b>${esc(t.name)}</b><span>${t.owner}</span><span>${t.date||'No date'}</span><button class="btn soft" onclick="toggleTask(${i})">${t.done?'Reopen':'Complete'}</button><button class="btn danger" onclick="remove('tasks',${i})">×</button></div>`).join('')||'<div class="empty">No work items</div>'}`;if(s.tab==='uat')return `<h3>UAT issues and queries</h3><div class="add"><div class="field"><label>UAT item</label><input id="un"></div><div class="field"><label>Status</label><select id="us"><option>Not Started</option><option>In Progress</option><option>Passed</option><option>Failed</option><option>Blocked</option></select></div><div class="field"><label>Owner</label><select id="uo"><option>Consultant</option><option>Customer</option></select></div><button class="btn primary" onclick="addUat()">Add</button></div>${p.uat.map((u,i)=>`<div class="item"><b>${esc(u.name)}</b><span>${u.status}</span><span>${u.owner}</span><span></span><button class="btn danger" onclick="remove('uat',${i})">×</button></div>`).join('')||'<div class="empty">No UAT items</div>'}`;return `<h3>Scoping and supporting documents</h3><div class="field"><label>Upload document</label><input type="file" onchange="addDoc(this)"></div><p class="muted">Files up to 750 KB are stored in this browser.</p>${p.docs.map((d,i)=>`<div class="item"><b>${esc(d.name)}</b><span>${d.size}</span><button class="btn soft" onclick="openDoc(${i})">Open</button><span></span><button class="btn danger" onclick="remove('docs',${i})">×</button></div>`).join('')||'<div class="empty">No documents uploaded</div>'}`}
function sync(){let p=cur();if(!p)return;document.querySelectorAll('[data-k]').forEach(e=>{let k=e.dataset.k,v=e.type==='number'?Number(e.value):e.value;if(k.startsWith('cat:'))p.cats[k.slice(4)]=v;else p[k]=v})}function saveP(){sync();persist();msg('Project changes saved');drawModal()}function delP(){if(confirm('Delete this project?')){s.projects=s.projects.filter(x=>x.id!==s.active);persist();closeP()}}function remove(k,i){cur()[k].splice(i,1);persist();drawModal()}function addBooking(){let d=$('#bd').value,n=Number($('#bn').value);if(!d||!n)return msg('Enter date and days');cur().bookings.push([d,n]);persist();drawModal()}function addTask(){let n=$('#tn').value;if(!n)return msg('Enter a task');cur().tasks.push({name:n,date:$('#td').value,owner:$('#to').value,done:false});persist();drawModal()}function toggleTask(i){cur().tasks[i].done=!cur().tasks[i].done;persist();drawModal()}function addUat(){let n=$('#un').value;if(!n)return msg('Enter a UAT item');cur().uat.push({name:n,status:$('#us').value,owner:$('#uo').value});persist();drawModal()}function addDoc(el){let f=el.files[0];if(!f)return;if(f.size>750000)return msg('Choose a file under 750 KB');let r=new FileReader;r.onload=()=>{cur().docs.push({name:f.name,size:Math.ceil(f.size/1024)+' KB',data:r.result});try{persist();drawModal();msg('Document uploaded')}catch(e){cur().docs.pop();msg('Browser storage is full')}};r.readAsDataURL(f)}function printProject(){sync();persist();let p=cur(),remaining=p.total-p.used,taskDone=p.tasks.filter(t=>t.done).length,uatPassed=p.uat.filter(u=>u.status==='Passed').length,now=new Date().toLocaleDateString('en-IE',{day:'2-digit',month:'long',year:'numeric'});let taskRows=p.tasks.length?p.tasks.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.owner)}</td><td>${t.date||'—'}</td><td>${t.done?'Completed':'Open'}</td></tr>`).join(''):'<tr><td colspan="4">No work items recorded</td></tr>',uatRows=p.uat.length?p.uat.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.owner)}</td><td>${esc(u.status)}</td></tr>`).join(''):'<tr><td colspan="3">No UAT items recorded</td></tr>',bookingRows=p.bookings.length?p.bookings.slice().sort((a,b)=>a[0].localeCompare(b[0])).map(b=>`<tr><td>${b[0]}</td><td>${b[1]}</td></tr>`).join(''):'<tr><td colspan="2">No project days booked</td></tr>';$('#printReport').innerHTML=`<div class="pr-head"><div><h1>PS Pro Project Report</h1><b>Acme Professional Services</b></div><div style="text-align:right"><b>${esc(p.id)}</b><br>Generated ${now}</div></div><h2>${esc(p.customer)}</h2><div class="pr-grid"><div class="pr-box"><small>Consultant</small><b>${esc(p.consultant)}</b></div><div class="pr-box"><small>Current phase</small><b>${esc(p.phase)}</b></div><div class="pr-box"><small>Phase start</small><b>${p.phaseDate||'—'}</b></div><div class="pr-box"><small>Project health</small><b class="pr-rag">${esc(p.rag)}</b></div><div class="pr-box"><small>Total billable days</small><b>${p.total}</b></div><div class="pr-box"><small>Days completed</small><b>${p.used}</b></div><div class="pr-box"><small>Days remaining</small><b>${remaining}</b></div><div class="pr-box"><small>Delivery progress</small><b>${p.total?Math.round(p.used/p.total*100):0}%</b></div></div><h2>Project note</h2><p>${esc(p.note)||'No project note recorded.'}</p><h2>Billable-day categories</h2><table><thead><tr><th>Category</th><th>Allocated days</th></tr></thead><tbody>${Object.entries(p.cats).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</tbody></table><h2>Work breakdown schedule (${taskDone}/${p.tasks.length} complete)</h2><table><thead><tr><th>Task</th><th>Owner</th><th>Planned date</th><th>Status</th></tr></thead><tbody>${taskRows}</tbody></table><h2>UAT log (${uatPassed}/${p.uat.length} passed)</h2><table><thead><tr><th>UAT item</th><th>Owner</th><th>Status</th></tr></thead><tbody>${uatRows}</tbody></table><h2>Booked project days</h2><table><thead><tr><th>Date</th><th>Days</th></tr></thead><tbody>${bookingRows}</tbody></table><h2>Documents</h2><p>${p.docs.length?p.docs.map(d=>esc(d.name)+' ('+esc(d.size)+')').join('<br>'):'No documents uploaded.'}</p><div class="pr-foot">Sample Data Only Below · Internal alpha report · PS Pro · Acme Professional Services</div>`;window.print()}function openDoc(i){let d=cur().docs[i],a=document.createElement('a');a.href=d.data;a.download=d.name;a.click()}render();
</script></body></html>
